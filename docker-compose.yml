services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: mssql-server

    ports:
      - 14333:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StrongP@ssw0rd2026!
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - pos-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    networks:
      - pos-network

volumes:
  sqldata:

networks:
  pos-network:


